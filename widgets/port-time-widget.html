<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:center;
background:transparent;
}

:root{
--clock:#b89a62;
--size:min(88vw,88vh);
}

@media (prefers-color-scheme: dark){
:root{
--clock:#b4e5eb;
}
}

.clock{
position:relative;
width:var(--size);
height:var(--size);
}

.tick{
position:absolute;
left:50%;
top:10%;
width:calc(var(--size)*0.004);
height:calc(var(--size)*0.06);
margin-left:calc(var(--size)*-0.002);
background:var(--clock);
transform-origin:center calc(var(--size)*0.40);
}

.hand{
position:absolute;
left:50%;
top:50%;
transform-origin:bottom center;
background:var(--clock);
border-radius:999px;
}

.hour{
width:calc(var(--size)*0.009);
height:calc(var(--size)*0.23);
margin-left:calc(var(--size)*-0.0045);
opacity:.7;
}

.minute{
width:calc(var(--size)*0.005);
height:calc(var(--size)*0.35);
margin-left:calc(var(--size)*-0.0025);
}

.second{
width:calc(var(--size)*0.002);
height:calc(var(--size)*0.44);
margin-left:calc(var(--size)*-0.001);
opacity:.6;
}

.center{
position:absolute;
top:50%;
left:50%;
width:calc(var(--size)*0.042);
height:calc(var(--size)*0.042);
margin:calc(var(--size)*-0.021);
border-radius:50%;
background:var(--clock);
}

.digital{
position:absolute;
top:58%;
left:50%;
transform:translateX(-50%);
font-family:Georgia,serif;
font-size:calc(var(--size)*0.12);
font-weight:600;
color:var(--clock);
white-space:nowrap;
}
</style>
</head>

<body>

<div class="clock" id="clock">
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center"></div>
<div class="digital" id="digital"></div>
</div>

<script>
const clock=document.getElementById("clock");

for(let i=0;i<12;i++){
const tick=document.createElement("div");
tick.className="tick";
tick.style.transform=`rotate(${i*30}deg)`;
clock.appendChild(tick);
}

function update(){
const now=new Date();

const s=now.getSeconds();
const m=now.getMinutes();
const h=now.getHours()%12;

hour.style.transform=`translate(-50%,-100%) rotate(${h*30+m/2}deg)`;
minute.style.transform=`translate(-50%,-100%) rotate(${m*6+s/10}deg)`;
second.style.transform=`translate(-50%,-100%) rotate(${s*6}deg)`;

digital.textContent=now.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});
}

setInterval(update,1000);
update();

(function(){
const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
document.body.style.background=dark?'rgb(25,25,25)':'white';
})();
</script>

</body>
</html>
