<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Wasteland Weather</title>

  <style>
    body {
      margin: 0;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: transparent;

      font-family: Georgia, serif;
    }

    .widget {
      width: 170px;

      background: #4f5b46;

      border-radius: 24px;

      padding: 18px;

      box-sizing: border-box;

      color: #f5f1e8;

      text-align: center;

      box-shadow:
        0 0 20px rgba(0,0,0,0.15);

      border:
        1px solid rgba(255,255,255,0.08);
    }

    select {
      width: 100%;

      margin-bottom: 12px;

      background: rgba(255,255,255,0.08);

      color: #f5f1e8;

      border: none;

      border-radius: 12px;

      padding: 8px;

      font-size: 14px;

      outline: none;
    }

    .icon {
      font-size: 42px;

      margin-bottom: 6px;
    }

    .temp {
      font-size: 34px;

      line-height: 1;

      margin-bottom: 4px;
    }

    .city {
      font-size: 14px;

      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="widget">

    <select id="citySelect">
      <option value="Moscow">Москва</option>
      <option value="Saint Petersburg">Санкт-Петербург</option>
      <option value="Stockholm">Стокгольм</option>
      <option value="Tokyo">Токио</option>
    </select>

    <div class="icon" id="icon">☁️</div>

    <div class="temp" id="temp">--°</div>

    <div class="city" id="city">...</div>

  </div>

<script>

const apiKey = "d209d7596adbcd6e064ab7eb55221434";

const citySelect = document.getElementById("citySelect");

async function getWeather(city) {

  const response = await fetch(
    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
  );

  const data = await response.json();

  document.getElementById("temp").innerText =
    Math.round(data.main.temp) + "°";

  document.getElementById("city").innerText =
    data.name;

  const weather = data.weather[0].main;

  let icon = "☁️";

  if(weather === "Clear") icon = "☀️";
  if(weather === "Rain") icon = "🌧";
  if(weather === "Snow") icon = "❄️";
  if(weather === "Thunderstorm") icon = "⛈";
  if(weather === "Clouds") icon = "☁️";
  if(weather === "Mist") icon = "🌫";

  document.getElementById("icon").innerText = icon;
}

citySelect.addEventListener("change", () => {
  getWeather(citySelect.value);
});

getWeather(citySelect.value);

</script>

</body>
</html>
