<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    /* BODY */
    
    body {
      position: relative;
      background: transparent;
      overflow: visible;
    }
    /* BACKGROUND FIX */
    
    .background-fix {
      position: absolute;
      inset: 0;
      background: rgb(25, 25, 25);
      z-index: -10;
    }
    .candles-wrap{
position:absolute;
bottom:-2%;
left:50%;
transform:translateX(-50%);

width:82%;
height:auto;

z-index:2;
}
    /* CANDLE GLOW */
.candle-glow{
position:absolute;
bottom:-10%;
left:50%;
transform:translateX(-50%);
width:120%;
height:110%;

background:radial-gradient(
ellipse,
rgba(255,190,90,0.18) 0%,
rgba(255,170,70,0.08) 35%,
transparent 78%
);

filter:blur(0px);

pointer-events:none;
z-index:3;
}
    /* CANDLES */
.candles{ 
position:relative; 
bottom:-2%; 
left:50%; 
transform:translateX(-50%); 
width:82%; 
max-width:720px; 
height:auto; 
pointer-events:none; u
ser-select:none; 
z-index:2; 
}
    /* DUST PARTICLES */
    
    .dust {
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 220, 140, 0.72);
      box-shadow: 0 0 8px rgba(255, 210, 120, 0.35);
      opacity: 0;
      animation: dustFloat linear infinite, dustGlow ease-in-out infinite;
      z-index: 3;
    }
    /* FLOAT */
    
    @keyframes dustFloat {
      0% {
        transform: translateY(0px) translateX(0px);
      }
      50% {
        transform: translateY(-18px) translateX(5px);
      }
      100% {
        transform: translateY(0px) translateX(0px);
      }
    }
    /* GLOW */
    
    @keyframes dustGlow {
      0% {
        opacity: 0.08;
      }
      50% {
        opacity: 0.75;
      }
      100% {
        opacity: 0.08;
      }
    }
  </style>
</head>

<body>
  <div class="background-fix"></div>
<div class="candles-wrap">
  <div class="candle-glow"></div>
  <img class="candles" src="../assets/candles.png">
</div>
  <!-- DUST -->
  <div class="dust" style=" left:18%; bottom:85px; width:2px; height:2px; animation-duration:8s,4s; "></div>
  <div class="dust" style=" left:27%; bottom:118px; width:3px; height:3px; animation-duration:11s,5s; "></div>
  <div class="dust" style=" left:39%; bottom:92px; width:2px; height:2px; animation-duration:9s,3s; "></div>
  <div class="dust" style=" left:52%; bottom:130px; width:3px; height:3px; animation-duration:12s,6s; "></div>
  <div class="dust" style=" left:66%; bottom:97px; width:2px; height:2px; animation-duration:10s,4s; "></div>
  <div class="dust" style=" left:78%; bottom:122px; width:3px; height:3px; animation-duration:13s,5s; "></div>
  <div class="dust" style=" left:87%; bottom:88px; width:2px; height:2px; animation-duration:9s,4s; "></div>
  <script>
    (function() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.body.style.background = isDark ? 'rgb(25,25,25)' : 'white';
    })();
  </script>
</body>

</html>
