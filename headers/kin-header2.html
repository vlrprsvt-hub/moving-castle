<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
position:relative;
overflow:hidden;
background:rgb(25,25,25);
}

/* BACKGROUND */

.background-fix{
position:absolute;
inset:0;
background:rgb(25,25,25);
z-index:-10;
}

/* RESPONSIVE STAGE */

.stage{
position:absolute;
left:0;
bottom:0;
width:100%;
height:100%;
}

/* GLOW */

.candle-glow{
position:absolute;
left:50%;
bottom:-6%;

transform:translateX(-50%);

width:135%;
height:55%;

background:
radial-gradient(
ellipse at center,
rgba(255,215,140,.34) 0%,
rgba(255,185,95,.18) 26%,
rgba(255,150,60,.08) 52%,
transparent 82%
);

filter:blur(7vh);

opacity:.95;

animation:pulse 4.8s ease-in-out infinite;

z-index:1;
}

/* CANDLES */

.candles{
position:absolute;
left:50%;
bottom:0;

transform:translateX(-50%);

width:auto;
height:72%;

max-width:none;

pointer-events:none;
user-select:none;

z-index:2;
}

/* PARTICLES */

.dust{
position:absolute;
border-radius:50%;
background:rgba(255,220,140,.75);
box-shadow:0 0 1vh rgba(255,210,120,.35);

animation:
float linear infinite,
glow ease-in-out infinite;

z-index:3;
}

/* TOP FADE */

.top-fade{
position:absolute;
top:0;
left:0;
width:100%;
height:14%;

background:
linear-gradient(
to bottom,
rgb(25,25,25),
transparent
);

z-index:4;
}

/* ANIMATIONS */

@keyframes pulse{
0%,100%{
opacity:.82;
transform:translateX(-50%) scale(1);
}
50%{
opacity:1;
transform:translateX(-50%) scale(1.08);
}
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-2.2vh);}
100%{transform:translateY(0);}
}

@keyframes glow{
0%,100%{opacity:.15;}
50%{opacity:.8;}
}

</style>
</head>

<body>

<div class="background-fix"></div>

<div class="stage">

<div class="candle-glow"></div>

<img class="candles" src="../assets/candles.png">

<div class="dust" style="left:18%; bottom:24%; width:.35vh; height:.35vh; animation-duration:8s,4s;"></div>
<div class="dust" style="left:29%; bottom:33%; width:.45vh; height:.45vh; animation-duration:10s,5s;"></div>
<div class="dust" style="left:43%; bottom:28%; width:.3vh; height:.3vh; animation-duration:9s,3s;"></div>
<div class="dust" style="left:55%; bottom:36%; width:.42vh; height:.42vh; animation-duration:12s,5s;"></div>
<div class="dust" style="left:69%; bottom:30%; width:.35vh; height:.35vh; animation-duration:11s,4s;"></div>
<div class="dust" style="left:82%; bottom:26%; width:.3vh; height:.3vh; animation-duration:9s,4s;"></div>

</div>

<div class="top-fade"></div>

</body>
</html>
