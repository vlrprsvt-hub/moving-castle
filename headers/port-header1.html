<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<style>
html, body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
position:relative;
}
body{
position:relative;
overflow:hidden;
}

/* SEA CONTAINER */

.sea{
position:absolute;
left:0;
bottom:18%;
width:100%;
height:42%;
overflow:hidden;
z-index:3;
pointer-events:none;
}

/* BASE */

.wave,
.foam{
position:absolute;
left:-20%;
width:140%;
border-radius:50%;
}

/* 2.1 DARK DRIFT */

.wave-back{
bottom:42%;
height:18%;

background:
rgba(16,45,90,0.28);

filter:blur(0.35vw);

animation:
drift 18s ease-in-out infinite alternate;
}

/* 2.2 MID SURGE */

.wave-mid{
bottom:18%;
height:20%;

background:
rgba(72,138,155,0.32);

filter:blur(0.28vw);

animation:
surge 10s ease-in-out infinite;
}

/* 2.3 FOAM */

.foam{
bottom:0%;
height:14%;

background:
rgba(180,225,235,0.48);

filter:blur(0.45vw);

animation:
wash 7s ease-in-out infinite;
}

/* BACK WAVE */

@keyframes drift{

0%{
transform:
translateX(-4%)
scaleX(1);
}

100%{
transform:
translateX(4%)
scaleX(1.04);
}

}

/* MID WAVE */

@keyframes surge{

0%{
transform:
translateY(0%)
scaleX(1);
opacity:0.24;
}

50%{
transform:
translateY(6%)
scaleX(1.06);
opacity:0.42;
}

100%{
transform:
translateY(0%);
opacity:0.24;
}

}

/* SHORE FOAM */

@keyframes wash{

0%{
transform:
translateY(8%)
scaleX(0.94);
opacity:0.18;
}

50%{
transform:
translateY(0%)
scaleX(1.08);
opacity:0.65;
}

100%{
transform:
translateY(8%)
scaleX(0.94);
opacity:0.18;
}

}

</style>
</head>

<body>
<div class="sea">
  <div class="wave wave-back"></div>
  <div class="wave wave-mid"></div>
  <div class="foam"></div>
</div>
<script>
(function() {

var mql = window.matchMedia('(prefers-color-scheme: dark)');
var isDark = typeof mql.matches === 'boolean' && mql.matches;

document.body.style.background =
isDark
? 'rgb(25,25,25)'
: 'white';

})();
</script>
</body></html>
