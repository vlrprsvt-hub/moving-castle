<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">

<style>

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

}

/* BODY */

body{

position:relative;

display:flex;
justify-content:center;
align-items:flex-start;

background:transparent;

overflow:hidden;

}

/* HEADER */

.header{

position:absolute;

top:6px;

font-family:'Cinzel', serif;

font-size:30px;
font-weight:500;

letter-spacing:1px;

color:#E7D9C8;

white-space:nowrap;

text-shadow:
0 0 10px rgba(231,217,200,0.08);

z-index:5;

}

</style>

</head>

<body>

<div class="header">

── Администрация ⚜ Договоры ⚜ Казна ──

</div>

<script>

(function() {

var mql = window.matchMedia('(prefers-color-scheme: dark)');
var isDark = typeof mql.matches === 'boolean' && mql.matches;

document.body.style.background =
isDark
? 'rgb(25,25,25)'
: 'white';

})();

</script>

</body>

</html>
