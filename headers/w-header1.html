<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;
}

body{

display:flex;
justify-content:center;
align-items:center;

height:36px;
min-height:36px;
max-height:36px;

background:transparent;

font-family:Georgia, serif;
font-size:20px;
letter-spacing:1px;
line-height:1;

color:#c09434;

overflow:hidden;
}

/* fake notion transparency */
@media (prefers-color-scheme: dark) {

body{
background:rgb(25,25,25);
}

}

@media (prefers-color-scheme: light) {

body{
background:white;
}

}

</style>

</head>
