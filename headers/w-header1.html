<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
margin:0;
padding:0;
overflow:hidden;
width:100%;
height:100%;
}

body{

background:#191919;

display:flex;
justify-content:center;
align-items:flex-start;

}

/* TOP DIVIDER */

.header{

position:absolute;
top:8px;

z-index:10;

font-family:Georgia, serif;
font-size:20px;
letter-spacing:1px;

color:#c09434;

}

/* GRASS FIELD */

.grass-container{

position:absolute;

bottom:0;
left:-10%;

width:120%;
height:140px;

overflow:hidden;

}

/* BASE GRASS */

.grass{

position:absolute;

width:140%;
height:180px;

bottom:-40px;
left:-20%;

background:

linear-gradient(
180deg,
#84b42a 0%,
#6a9a18 40%,
#4f7411 100%
);

clip-path: polygon(
0% 100%,
0% 40%,

3% 25%,
6% 45%,
9% 20%,
12% 50%,
15% 18%,
18% 42%,
21% 22%,
24% 48%,
27% 15%,
30% 45%,
33% 25%,
36% 52%,
39% 18%,
42% 40%,
45% 20%,
48% 50%,
51% 22%,
54% 44%,
57% 15%,
60% 42%,
63% 18%,
66% 48%,
69% 24%,
72% 40%,
75% 20%,
78% 45%,
81% 16%,
84% 50%,
87% 20%,
90% 42%,
93% 18%,
96% 48%,
100% 35%,

100% 100%
);

filter: blur(0.4px);

animation: wave 7s ease-in-out infinite alternate;

}

/* SHADOW LAYER */

.grass::before{

content:"";

position:absolute;
inset:0;

background:

radial-gradient(
circle at 20% 40%,
rgba(0,0,0,0.18),
transparent 30%
),

radial-gradient(
circle at 70% 60%,
rgba(255,255,255,0.12),
transparent 35%
),

radial-gradient(
circle at 50% 20%,
rgba(0,0,0,0.12),
transparent 25%
);

mix-blend-mode: overlay;

animation: shimmer 10s linear infinite;

}

@keyframes wave {

0%{
transform:
translateX(0px)
skewX(-2deg)
translateY(0px);
}

50%{
transform:
translateX(-20px)
skewX(2deg)
translateY(-4px);
}

100%{
transform:
translateX(20px)
skewX(-1deg)
translateY(2px);
}

}

@keyframes shimmer {

0%{
transform:translateX(-5%);
}

100%{
transform:translateX(5%);
}

}

</style>

</head>

<body>

<div class="header">
───────── ✦ ─────────
</div>

<div class="grass-container">

<div class="grass"></div>

</div>

</body>

</html>
