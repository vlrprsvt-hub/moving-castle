<!DOCTYPE html>

<style>

html, body {
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{

background:#191919;

display:flex;
justify-content:center;
align-items:flex-start;

overflow:hidden;

}

/* HEADER */

.header{

position:absolute;
top:8px;

z-index:10;

font-family:Georgia, serif;
font-size:20px;
letter-spacing:1px;

color:#c09434;

}

/* GRASS AREA */

.grass-field{

position:absolute;

bottom:-10px;
left:0;

width:100%;
height:90px;

overflow:hidden;

}

/* BLADES */

.blade{

position:absolute;
bottom:0;

width:1px;

border-radius:999px;

background:
linear-gradient(
to top,
#4f7411,
#6a9a18,
#8fbc3f
);

transform-origin:bottom center;

/* SAME ANIMATION */
animation:wind 5s ease-in-out infinite;

filter:blur(0.2px);

opacity:0.95;

}

/* WIND */

@keyframes wind {

0%{
transform:
rotate(-7deg)
translateX(0px);
}

25%{
transform:
rotate(-2deg)
translateX(1px);
}

50%{
transform:
rotate(6deg)
translateX(2px);
}

75%{
transform:
rotate(2deg)
translateX(1px);
}

100%{
transform:
rotate(-7deg)
translateX(0px);
}

}

</style>

</head>
