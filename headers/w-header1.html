<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:center;
position:relative;

font-family:Georgia, serif;
font-size:20px;
letter-spacing:1px;
line-height:1;

color:#c09434;

overflow:hidden;
}

/* fake notion transparency */
@media (prefers-color-scheme: dark) {
body{
background:rgb(25,25,25);
}
}

@media (prefers-color-scheme: light) {
body{
background:white;
}
}

.text{
position:relative;
z-index:5;
}

.grass{
position:absolute;
bottom:0;
left:0;
width:100%;
height:55px;

opacity:0.45;
}

.blade{
position:absolute;
bottom:-10px;
width:3px;
border-radius:999px;

background:linear-gradient(
to top,
#2d4a2f,
#4d7a50
);

transform-origin:bottom center;

animation:sway 4s ease-in-out infinite;
}

@keyframes sway {

0%{
transform:rotate(-4deg);
}

50%{
transform:rotate(4deg);
}

100%{
transform:rotate(-4deg);
}

}

</style>

</head>

<body>

<div class="text">
───────── ✦ ─────────
</div>

<div class="grass">

<div class="blade" style="left:5%;height:40px;animation-delay:0s;"></div>
<div class="blade" style="left:10%;height:55px;animation-delay:1s;"></div>
<div class="blade" style="left:16%;height:35px;animation-delay:2s;"></div>
<div class="blade" style="left:24%;height:48px;animation-delay:1.4s;"></div>
<div class="blade" style="left:32%;height:60px;animation-delay:0.7s;"></div>
<div class="blade" style="left:40%;height:38px;animation-delay:2.1s;"></div>
<div class="blade" style="left:50%;height:50px;animation-delay:1.8s;"></div>
<div class="blade" style="left:60%;height:42px;animation-delay:0.2s;"></div>
<div class="blade" style="left:70%;height:58px;animation-delay:2.5s;"></div>
<div class="blade" style="left:82%;height:46px;animation-delay:1.2s;"></div>
<div class="blade" style="left:92%;height:54px;animation-delay:0.9s;"></div>

</div>

</body>
</html>
