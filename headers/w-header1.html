<style>

html, body {
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{

background:#191919;

display:flex;
justify-content:center;
align-items:flex-start;

overflow:hidden;

}

/* HEADER */

.header{

position:absolute;
top:8px;

z-index:10;

font-family:Georgia, serif;
font-size:20px;
letter-spacing:1px;

color:#c09434;

}

/* GRASS AREA */

.grass-field{

position:absolute;

bottom:-10px;
left:0;

width:100%;
height:70px;

overflow:hidden;

}

/* BLADES */

/* sharper grass tip */

.blade{

position:absolute;
bottom:0;

width:2px;

/* sharp tip */
clip-path: polygon(
50% 0%,
100% 100%,
0% 100%
);

background:
linear-gradient(
to top,
#4f7411,
#6a9a18,
#9ecf3d
);

transform-origin:bottom center;

animation:wind 5s ease-in-out infinite;

opacity:0.95;

}
.back-blade{

position:absolute;
bottom:0;

clip-path: polygon(
50% 0%,
100% 100%,
0% 100%
);

background:
linear-gradient(
to top,
#35550d,
#4f7411,
#6a9a18
);

opacity:0.22;

filter:blur(1px);

transform-origin:bottom center;

animation:wind-back 7s ease-in-out infinite;

}

/* WIND */

@keyframes wind {

0%{
transform:
rotate(-7deg)
translateX(0px);
}

25%{
transform:
rotate(-2deg)
translateX(1px);
}

50%{
transform:
rotate(6deg)
translateX(2px);
}

75%{
transform:
rotate(2deg)
translateX(1px);
}

100%{
transform:
rotate(-7deg)
translateX(0px);
}

}
@keyframes wind-back {

0%{
transform:
rotate(-5deg)
translateX(0px);
}

50%{
transform:
rotate(4deg)
translateX(1px);
}

100%{
transform:
rotate(-5deg)
translateX(0px);
}

}
</style>
