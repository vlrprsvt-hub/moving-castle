<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:center;
background:transparent;
font-family:Georgia,serif;
}

.clock-wrap{
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
}

.clock{
position:relative;
width:180px;
height:180px;
border:2px solid #b89a62;
border-radius:50%;
}

.tick{
position:absolute;
left:50%;
top:8px;
width:1px;
height:8px;
background:#b89a62;
transform-origin:50% 82px;
opacity:.9;
}

.tick.major{
height:14px;
width:2px;
}

.hand{
position:absolute;
left:50%;
bottom:50%;
transform-origin:bottom center;
border-radius:999px;
}

.hour{
width:3px;
height:42px;
margin-left:-1.5px;
background:#d6e3e8;
}

.minute{
width:2px;
height:58px;
margin-left:-1px;
background:#6a9aa4;
}

.second{
width:1px;
height:70px;
margin-left:-0.5px;
background:#b89a62;
}

.center{
position:absolute;
top:50%;
left:50%;
width:10px;
height:10px;
margin:-5px;
border-radius:50%;
background:#b89a62;
}

.zone{
font-size:15px;
letter-spacing:2px;
color:#8da5af;
text-transform:uppercase;
}

.time{
font-size:18px;
letter-spacing:3px;
color:#e7d9c8;
}
</style>
</head>

<body>

<div class="clock-wrap">

<div class="clock" id="clock">
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center"></div>
</div>

<div class="zone" id="zone"></div>
<div class="time" id="digital"></div>

</div>

<script>

const clock = document.getElementById('clock');

for(let i=0;i<60;i++){
const tick=document.createElement('div');
tick.className=i%5===0?'tick major':'tick';
tick.style.transform=`rotate(${i*6}deg)`;
clock.appendChild(tick);
}

const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;

document.getElementById('zone').textContent=
tz.split('/').pop().replace('_',' ');

function update(){

const now=new Date();

const s=now.getSeconds()+now.getMilliseconds()/1000;
const m=now.getMinutes()+s/60;
const h=(now.getHours()%12)+m/60;

hour.style.transform=`rotate(${h*30}deg)`;
minute.style.transform=`rotate(${m*6}deg)`;
second.style.transform=`rotate(${s*6}deg)`;

digital.textContent=now.toLocaleTimeString();

requestAnimationFrame(update);
}

update();

(function(){
var dark=window.matchMedia('(prefers-color-scheme: dark)').matches;

document.body.style.background=
dark?'rgb(25,25,25)':'white';

document.documentElement.style.background=
dark?'rgb(25,25,25)':'white';
})();
</script>

</body>
</html>
