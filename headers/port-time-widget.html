<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:transparent;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

:root{
--clock:#b89a62;
--size:min(82vmin, 92vw, 92vh);
}

@media (prefers-color-scheme: dark){
:root{
--clock:#b4e5eb;
}
}

.clock{
position:relative;
width:var(--size);
height:var(--size);
}

.tick{
position:absolute;
left:50%;
top:10%;
width:0.45%;
height:6%;
background:var(--clock);
transform-origin:center calc(var(--size) * 0.40);
opacity:.9;
}

.hand{
position:absolute;
left:50%;
top:50%;
transform-origin:bottom center;
background:var(--clock);
border-radius:999px;
}

.hour{
width:0.95%;
height:23%;
margin-left:-0.475%;
opacity:.7;
}

.minute{
width:0.55%;
height:35%;
margin-left:-0.275%;
}

.second{
width:0.25%;
height:44%;
margin-left:-0.125%;
opacity:.65;
}

.center{
position:absolute;
top:50%;
left:50%;
width:4.2%;
height:4.2%;
margin:-2.1%;
border-radius:50%;
background:var(--clock);
}

.digital{
position:absolute;
top:58%;
left:50%;
transform:translateX(-50%);
font-family:Georgia,serif;
font-size:12%;
font-weight:600;
letter-spacing:0.04em;
color:var(--clock);
white-space:nowrap;
}
</style>
</head>

<body>

<div class="clock" id="clock">
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center"></div>
<div class="digital" id="digital"></div>
</div>

<script>
const clock=document.getElementById('clock');

for(let i=0;i<12;i++){
const tick=document.createElement('div');
tick.className='tick';
tick.style.transform=`rotate(${i*30}deg)`;
clock.appendChild(tick);
}
