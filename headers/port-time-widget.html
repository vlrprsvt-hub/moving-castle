<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:transparent;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

:root{
--clock:#b89a62;
}

@media (prefers-color-scheme: dark){
:root{
--clock:#b4e5eb;
}
}

.clock{
position:relative;
width:320px;
height:320px;
}

.tick{
position:absolute;
left:50%;
top:42px;
width:2px;
height:26px;
background:var(--clock);
transform-origin:center 168px;
opacity:.9;
}

.hand{
position:absolute;
left:50%;
top:50%;
transform-origin:bottom center;
background:var(--clock);
border-radius:999px;
}

.hour{
width:4px;
height:96px;
margin-left:-2px;
opacity:.7;
}

.minute{
width:2px;
height:148px;
margin-left:-1px;
}

.second{
width:1px;
height:184px;
margin-left:-0.5px;
opacity:.65;
}

.center{
position:absolute;
top:50%;
left:50%;
width:18px;
height:18px;
margin:-9px;
border-radius:50%;
background:var(--clock);
}

.digital{
position:absolute;
top:58%;
left:50%;
transform:translateX(-50%);
font-family:Georgia,serif;
font-size:52px;
font-weight:600;
letter-spacing:1px;
color:var(--clock);
}
</style>
</head>

<body>

<div class="clock" id="clock">
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center"></div>
<div class="digital" id="digital"></div>
</div>

<script>
const clock=document.getElementById('clock');

for(let i=0;i<12;i++){
const tick=document.createElement('div');
tick.className='tick';
tick.style.transform=`rotate(${i*30}deg)`;
clock.appendChild(tick);
}

function update(){
const now=new Date();

const s=now.getSeconds();
const m=now.getMinutes();
const h=now.getHours()%12;

hour.style.transform=
`translate(-50%,-100%) rotate(${h*30+m/2}deg)`;

minute.style.transform=
`translate(-50%,-100%) rotate(${m*6+s/10}deg)`;

second.style.transform=
`translate(-50%,-100%) rotate(${s*6}deg)`;

digital.textContent=
now.toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});
}

setInterval(update,1000);
update();

(function(){
var dark=window.matchMedia('(prefers-color-scheme: dark)').matches;

document.body.style.background=
dark?'rgb(25,25,25)':'white';

})();
</script>

</body>
</html>
