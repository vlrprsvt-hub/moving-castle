<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:center;
background:transparent;
font-family:Georgia, serif;
}

/* fake notion bg */

body::before{
content:"";
position:fixed;
inset:0;
background:rgb(25,25,25);
z-index:-2;
}

@media (prefers-color-scheme: light){
body::before{
background:white;
}
}

.widget{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

/* CLOCK */

.clock{
position:relative;
width:min(38vw,150px);
height:min(38vw,150px);
border:2px solid #b89a62;
border-radius:50%;

box-shadow:
0 0 14px rgba(184,154,98,0.18),
inset 0 0 16px rgba(106,154,164,0.08);

backdrop-filter:blur(2px);
}

/* ticks */

.tick{
position:absolute;
left:50%;
top:4px;
width:1px;
height:8px;
background:#b89a62;
transform-origin:50% calc(100% - 68px);
opacity:.75;
}

.tick.major{
height:12px;
width:2px;
opacity:1;
}

/* hands */

.hand{
position:absolute;
left:50%;
bottom:50%;
transform-origin:bottom center;
border-radius:999px;
}

.hour{
width:3px;
height:30px;
margin-left:-1.5px;
background:#dce7ea;
}

.minute{
width:2px;
height:46px;
margin-left:-1px;
background:#6a9aa4;
}

.second{
width:1px;
height:54px;
margin-left:-0.5px;
background:#b89a62;
}

.center{
position:absolute;
top:50%;
left:50%;
width:8px;
height:8px;
margin:-4px;
border-radius:50%;
background:#b89a62;
box-shadow:0 0 8px rgba(184,154,98,.45);
}

/* timezone */

.zone{
font-size:12px;
letter-spacing:1px;
color:#8faab2;
text-transform:uppercase;
}

.time{
font-size:15px;
letter-spacing:2px;
color:#e7d9c8;
}
</style>
</head>

<body>

<div class="widget">

<div class="clock" id="clock">
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center"></div>
</div>

<div class="zone" id="zone"></div>
<div class="time" id="digital"></div>

</div>

<script>

/* generate ticks */

const clock = document.getElementById("clock");

for(let i=0;i<60;i++){
const tick = document.createElement("div");
tick.className = i % 5 === 0 ? "tick major" : "tick";
tick.style.transform = `rotate(${i*6}deg)`;
clock.appendChild(tick);
}

/* timezone auto detect */

const timezone =
Intl.DateTimeFormat().resolvedOptions().timeZone;

document.getElementById("zone").textContent =
timezone.split("/").pop().replace("_"," ");

/* update */

function updateClock(){

const now = new Date();

const sec = now.getSeconds() + now.getMilliseconds()/1000;
const min = now.getMinutes() + sec/60;
const hr = (now.getHours()%12) + min/60;

document.getElementById("second").style.transform =
`rotate(${sec*6}deg)`;

document.getElementById("minute").style.transform =
`rotate(${min*6}deg)`;

document.getElementById("hour").style.transform =
`rotate(${hr*30}deg)`;

document.getElementById("digital").textContent =
now.toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit',
second:'2-digit'
});

requestAnimationFrame(updateClock);
}

updateClock();

</script>

</body>
</html>
