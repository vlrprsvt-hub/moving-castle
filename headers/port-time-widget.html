<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
html, body {
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:transparent;
}

body{
display:flex;
justify-content:center;
align-items:center;
font-family:Georgia, serif;
}

.clock{
position:relative;
width:260px;
height:260px;
border:2px solid var(--clock-color);
border-radius:50%;
}

.tick{
position:absolute;
left:50%;
top:10px;
width:2px;
height:16px;
background:var(--clock-color);
transform-origin:center 120px;
opacity:.9;
}

.tick.small{
height:10px;
opacity:.6;
}

.hand{
position:absolute;
left:50%;
top:50%;
transform-origin:bottom center;
border-radius:999px;
}

.hour{
width:4px;
height:55px;
margin-left:-2px;
background:var(--clock-color);
}

.minute{
width:3px;
height:80px;
margin-left:-1.5px;
background:var(--clock-color);
opacity:.75;
}

.second{
width:1px;
height:95px;
margin-left:-0.5px;
background:var(--clock-color);
opacity:.55;
}

.center{
position:absolute;
top:50%;
left:50%;
width:14px;
height:14px;
margin:-7px;
border-radius:50%;
background:var(--clock-color);
}

.digital{
position:absolute;
top:57%;
left:50%;
transform:translateX(-50%);
font-size:24px;
font-weight:600;
letter-spacing:2px;
color:var(--clock-color);
}
</style>
</head>

<body>

<div class="clock" id="clock">
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="center"></div>
<div class="digital" id="digital"></div>
</div>

<script>

const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

document.documentElement.style.setProperty(
'--clock-color',
dark ? '#b4e5eb' : '#b89a62'
);

const clock = document.getElementById('clock');

for(let i=0;i<12;i++){
const tick=document.createElement('div');
tick.className='tick';
tick.style.transform=`rotate(${i*30}deg)`;
clock.appendChild(tick);
}

function update(){

const now = new Date();

const sec = now.getSeconds();
const min = now.getMinutes();
const hr = now.getHours()%12;

document.getElementById('hour').style.transform =
`translate(-50%, -100%) rotate(${hr*30 + min/2}deg)`;

document.getElementById('minute').style.transform =
`translate(-50%, -100%) rotate(${min*6}deg)`;

document.getElementById('second').style.transform =
`translate(-50%, -100%) rotate(${sec*6}deg)`;

document.getElementById('digital').textContent =
now.toLocaleTimeString([], {
hour:'2-digit',
minute:'2-digit'
});
}

setInterval(update,1000);
update();

(function(){
document.body.style.background =
dark ? 'rgb(25,25,25)' : 'white';

document.documentElement.style.background =
dark ? 'rgb(25,25,25)' : 'white';
})();

</script>

</body>
</html>
